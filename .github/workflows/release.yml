name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK 与 Rust 交叉编译工具链
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk

      - name: 还原签名文件（仅构建期使用，不落盘进仓库）
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android-app/release.jks
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: 打包（自动携带版本号递增逻辑）
        run: ./gradlew :app:assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: 清理签名文件
        if: always()
        run: rm -f android-app/release.jks

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: hyperss-release
          path: android-app/app/build/outputs/apk/release/*.apk