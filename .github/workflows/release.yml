name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK 与 Rust 交叉编译工具链
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk

      - name: 还原签名文件（仅构建期使用，不落盘进仓库；无效时回退 debug 签名）
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android-app/release.jks
          fi
          if [ -s android-app/release.jks ]; then
            if ! keytool -list -keystore android-app/release.jks -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" > /dev/null 2>&1; then
              echo "::warning::release.jks 无效或密码不匹配，本次回退 debug 签名（与历史发布版本一致）"
              rm -f android-app/release.jks
            fi
          else
            rm -f android-app/release.jks
            echo "::warning::未配置有效签名密钥，本次回退 debug 签名（与历史发布版本一致）"
          fi

      - name: 接受 SDK 许可（compileSdk 高版本平台需自动下载）
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 打包（自动携带版本号递增逻辑）
        working-directory: android-app
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleRelease --stacktrace > build-ci.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "FAILURE:|What went wrong|Caused by:|error:|Error:|Exception|missing|not found|permission" build-ci.log | tail -12 | while IFS= read -r l; do echo "::error::${l:0:180}"; done
            tail -6 build-ci.log | while IFS= read -r l; do echo "::error::TAIL|${l:0:180}"; done
          fi
          exit $code
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: 清理签名文件
        if: always()
        run: rm -f android-app/release.jks

      - name: 创建 GitHub Release 并附上 APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android-app/app/build/outputs/apk/release/*.apk